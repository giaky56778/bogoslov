# This compose reuses an image for multiple containers. Because of this it should be built in advance with:
# docker build -t bogoslov .

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      - POSTGRES_DB=bogoslov
      - POSTGRES_USER=bogoslov
      - POSTGRES_HOST_AUTH_METHOD=trust
    ports:
      - 5732:5432
    volumes:
      - ./db/data.${CORPUS_LANG}/:/var/lib/postgresql/data/
      - ./db/init.${CORPUS_LANG}/:/docker-entrypoint-initdb.d/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d bogoslov -U bogoslov"]
    restart: always

  populate:
    image: bogoslov
    env_file:
      - .env
    environment:
      - LANG_CORPUS=${CORPUS_LANG}
      - HF_HOME=/models/
    volumes:
      - ./corpora.${CORPUS_LANG}/:/corpora/:ro
      - ./models/:/models/
      - ./config.toml:/home/app/config.toml:ro
      # For: docker cp src/. ...
      - ./src/model.py:/home/app/model.py
      - ./src/populate.py:/home/app/populate.py
      - ./src/tei_converter.py:/home/app/tei_converter.py
      - ./src/persists_dir/text.py:/home/app/persists_dir/text.py
      - ./src/account.py:/home/app/account.py
      - ./src/settings.py:/home/app/settings.py
      - ./src/db.py:/home/app/db.py
    #command: ./populate.py -v -e -n --biblical
    command: ./populate.py --biblical --example -f
    # command: ./populate.py -e 
    # command: tail -f /dev/null
    restart: no
    depends_on:
      - db
